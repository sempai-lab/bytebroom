[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bytebroom"
dynamic = ["version"]
description = "See which caches eat your disk on Windows (uv, pip, npm, Docker, Hugging Face, browsers...) and clear them safely."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "ByteBroom contributors" }]
keywords = ["cache", "cleaner", "disk-space", "windows", "uv", "pip", "docker", "customtkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = ["customtkinter>=5.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.gui-scripts]
bytebroom = "bytebroom.app:main"

[tool.hatch.version]
path = "src/bytebroom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bytebroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
